# Local stack: PostgreSQL + pgvector, Redis, a one-shot migration job, and the API.
#
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose ps
#
# Values like ${POSTGRES_USER} are read from the root .env file.

name: ai-knowledge-assistant

# Shared definition for the two services that run the backend image.
x-backend: &backend
  build: ./backend
  image: ai-knowledge-assistant-backend:dev
  environment: &backend-env
    NODE_ENV: production
    # Inside the compose network, services reach each other by SERVICE NAME and the
    # container's internal port: "postgres:5432", not "localhost:5433".
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1 = reachable from your Mac only, not your network.
      # Host port 5433 because a local Postgres already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<version>/...
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    # Append-only file: Redis writes every change to disk, so memory survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs pending SQL migrations once, then exits. The API waits for it to succeed.
  migrate:
    <<: *backend
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Embeddings (Milestone 6). Empty key = API runs, ingestion returns 503 (search falls back to keyword).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Chat (Milestone 8). Same key. Empty key = /chat returns 503.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Liveness only (see routes/health.ts): a Redis blip must not restart the API.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
